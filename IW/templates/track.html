{% extends "base.html" %}


{% block content %}
<h2>{{ track.title }}</h2>
<a href="/edit/{{ track.id }}">Edit</a>
<a href="/delete/{{ track.id }}">Delete</a>
<p>Исполнитель: {{ track.artist }}</p>
<p>Жанр: {{ track.genre.capitalize() }}</p>
<p>Длительность: {{ track.duration }} сек</p>
<p>Дата: {{ track.created_at }}</p>

{% endblock %}
